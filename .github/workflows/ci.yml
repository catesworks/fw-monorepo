name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test

      # infra/zitadel-local is not a pnpm workspace package, so `pnpm test` skips it.
      # Pure unit tests: no secrets, no Zitadel.
      - name: Force-SSO gate unit tests
        working-directory: infra/zitadel-local
        run: node --test force-sso-gate/gate.test.mjs
