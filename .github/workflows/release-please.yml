name: Release Please

# Maintains a rolling "Release PR" from Conventional Commits on main. Merging it
# writes CHANGELOG.md and pushes a `vX.Y.Z` tag. release-type is `simple`: it
# owns the changelog and tag only — it does not touch package.json (this repo
# is not npm-published).

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: { group: ci-runners, labels: [self-hosted, macOS, ARM64] }
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # A fine-grained PAT (contents+PRs write) so the tag this action pushes
          # can trigger other workflows — the default GITHUB_TOKEN cannot trigger
          # other workflows. Falls back to GITHUB_TOKEN when the PAT is absent:
          # the Release PR + tag still land either way.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
